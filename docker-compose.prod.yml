# PostgreSQL in production, with the data directory on an EBS-backed host path.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences from docker-compose.yml, and why each one is load-bearing:
#
#   bind mount      The named volume used in development exists only in Docker's storage on the EC2
#                   instance root volume, so losing the instance loses the database. POSTGRES_DATA_DIR
#                   points at a path on the attached EBS volume instead, which is detachable,
#                   snapshot-able and survives an instance replacement.
#   port published  Removed. Nothing outside the instance connects to PostgreSQL; the app talks to it
#                   over the instance's private network, so the only exposure would be a way in.
#   healthcheck     Left in place because `depends_on: condition: service_healthy` is how a restarted
#                   database is guaranteed to be accepting queries before the app is started.
#
# Requires: a formatted ext4 volume mounted at POSTGRES_DATA_DIR, owned by uid 999 (postgres).
# See deploy/postgres.md for the attach/format/mount steps and the snapshot schedule.

services:
  postgres:
    image: postgres:16-alpine
    container_name: string-theory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR must point at the EBS mount}
        target: /var/lib/postgresql/data
    ports: []
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'